[versions]
spotless = "8.2.1"
checkstyle = "13.2.0"
junit = "5.14.3"
mockito = "5.21.0"
assertj = "3.27.7"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-runner = { module = "org.junit.platform:junit-platform-runner" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

# Consumed by buildSrc so the convention plugin can apply Spotless by id.
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
