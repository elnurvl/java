plugins {
    // Made available to subprojects; the root has no production code of its own.
    id 'com.diffplug.spotless' version "$spotlessPluginVersion" apply false
    // Merges per-module coverage into a single project-wide report.
    id 'jacoco-report-aggregation'
}

// Shared configuration applied to every module in the monolith.
subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'
    apply plugin: 'checkstyle'
    apply plugin: 'com.diffplug.spotless'

    repositories {
        mavenCentral()
    }

    spotless {
        java {
            googleJavaFormat()
        }
    }

    checkstyle {
        toolVersion = "$checkstyleVersion"
        maxWarnings = 0
        configDirectory = rootProject.layout.projectDirectory.dir('config/checkstyle')
    }

    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
        testRuntimeOnly "org.junit.platform:junit-platform-runner"
        testImplementation "org.mockito:mockito-core:$mockitoVersion"
        testImplementation "org.assertj:assertj-core:$assertJVersion"
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    tasks.named('jacocoTestReport') {
        reports {
            csv.required = true
        }
    }
}

// The aggregated report's JaCoCo tooling is resolved against the root project.
repositories {
    mavenCentral()
}

// Pull coverage data from every module into the aggregated report.
dependencies {
    subprojects.each { jacocoAggregation it }
}

reporting {
    reports {
        testCodeCoverageReport(JacocoCoverageReport) {
            testSuiteName = 'test'
        }
    }
}

// Keep the legacy report path so tooling (git hooks, CI badge) stays unchanged.
tasks.named('testCodeCoverageReport') {
    reports {
        csv.required = true
        csv.outputLocation = layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.csv')
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/test/html')
    }
}
