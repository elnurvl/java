import org.gradle.api.artifacts.VersionCatalogsExtension

// Shared build configuration for every module in the monolith.
plugins {
    id 'java'
    id 'jacoco'
    id 'checkstyle'
    id 'com.diffplug.spotless'
}

// Precompiled script plugins don't get the type-safe `libs` accessor, so read the catalog directly.
def libs = extensions.getByType(VersionCatalogsExtension).named('libs')

repositories {
    mavenCentral()
}

spotless {
    java {
        googleJavaFormat()
    }
}

checkstyle {
    toolVersion = libs.findVersion('checkstyle').get().requiredVersion
    maxWarnings = 0
    configDirectory = rootProject.layout.projectDirectory.dir('config/checkstyle')
}

dependencies {
    testImplementation libs.findLibrary('junit-jupiter').get()
    testRuntimeOnly libs.findLibrary('junit-platform-runner').get()
    testImplementation libs.findLibrary('mockito-core').get()
    testImplementation libs.findLibrary('assertj-core').get()
}

tasks.named('test', Test) {
    useJUnitPlatform()
}
